
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>AI صاد</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f4f7ff;font-family:Arial,sans-serif}
header{padding:22px 18px;background:#17243a;border-bottom:1px solid #30415e}
h1{margin:0;color:#69c8ff;font-size:27px}
header p{margin:8px 0 0;color:#b8c7dc}
main{max-width:650px;margin:auto;padding:22px 16px}
.welcome{padding:24px 18px;background:#19283f;border:1px solid #304968;border-radius:18px}
.welcome h2{margin-top:0}
#chat{display:flex;flex-direction:column;gap:12px;margin:20px 0}
.msg{padding:13px 15px;border-radius:14px;background:#1c2b42;line-height:1.7;overflow-wrap:anywhere}
.user{background:#17466a}
form{display:flex;gap:8px;position:sticky;bottom:0;padding:12px 0;background:#101827}
input{min-width:0;flex:1;padding:14px;border:1px solid #415675;border-radius:12px;background:#19283f;color:white;font-size:16px}
button{border:0;border-radius:12px;padding:12px 17px;background:#42b9f5;color:#071626;font-weight:bold;font-size:16px}
.note{color:#a9b9ce;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<header>
<h1>✦ AI صاد</h1>
<p>مساعدك الذكي باللغة العربية</p>
</header>
<main>
<section class="welcome">
<h2>أهلاً بيك 👋</h2>
<p>آني AI صاد، واجهتك للمساعدة والإجابة عن أسئلتك.</p>
<p class="note">هذه نسخة أولية تجريبية. المحادثة تحتاج ربط خدمة ذكاء اصطناعي حتى تحصل على إجابات ذكية فعلية.</p>
</section>
<div id="chat" aria-live="polite">
<div class="msg">مرحباً! اكتب رسالتك حتى نختبر واجهة AI صاد.</div>
</div>
<form id="form">
<input id="message" placeholder="اكتب رسالتك هنا..." autocomplete="off" required>
<button type="submit">إرسال</button>
</form>
<p class="note">الإصدار الأولي · AI صاد</p>
</main>
<script>
const form=document.getElementById('form');
const input=document.getElementById('message');
const chat=document.getElementById('chat');
form.addEventListener('submit',function(e){
e.preventDefault();
const value=input.value.trim();
if(!value)return;
const msg=document.createElement('div');
msg.className='msg user';
msg.textContent=value;
chat.appendChild(msg);
const reply=document.createElement('div');
reply.className='msg';
reply.textContent='وصلت رسالتك بنجاح إلى واجهة AI صاد. حتى أجاوبك بالذكاء الاصطناعي الحقيقي، لازم نربط محرك ذكاء اصطناعي بالبرنامج.';
chat.appendChild(reply);
input.value='';
chat.scrollIntoView({behavior:'smooth',block:'end'});
});
</script>
</body>
</html>
